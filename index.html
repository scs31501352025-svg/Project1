<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Hello, World — A Little Moment of Wonder</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');

    :root {
      color-scheme: dark;
      --ink: #f6f1e9;
      --muted: #b5b3c8;
      --gold: #f3c879;
      --violet: #a79cff;
    }

    * { box-sizing: border-box; }

    nav {
      position: fixed;
      z-index: 2;
      top: 28px;
      right: clamp(20px, 6vw, 72px);
      display: flex;
      gap: 27px;
    }

    nav a {
      color: var(--muted);
      font-size: .76rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-decoration: none;
      transition: color .2s ease;
    }

    nav a:hover, nav a:focus-visible { color: var(--gold); }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% 110%, rgba(108, 74, 167, .37), transparent 48%),
        radial-gradient(ellipse at 15% 12%, rgba(55, 94, 160, .2), transparent 38%),
        #0b1020;
      font-family: 'DM Sans', sans-serif;
    }

    .sky, .sky::before, .sky::after {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .sky {
      opacity: .75;
      background-image:
        radial-gradient(1px 1px at 8% 24%, #fff 98%, transparent),
        radial-gradient(1.5px 1.5px at 82% 18%, #fff 98%, transparent),
        radial-gradient(1px 1px at 68% 73%, #fff 98%, transparent),
        radial-gradient(1.5px 1.5px at 23% 82%, #fff 98%, transparent),
        radial-gradient(1px 1px at 92% 56%, #fff 98%, transparent),
        radial-gradient(1px 1px at 45% 12%, #fff 98%, transparent),
        radial-gradient(1px 1px at 38% 63%, #fff 98%, transparent);
      background-size: 370px 310px;
      animation: shimmer 7s ease-in-out infinite alternate;
    }

    .sky::before {
      content: '';
      background: radial-gradient(ellipse at center, transparent 30%, rgba(4, 7, 17, .58) 100%);
    }

    main {
      position: relative;
      z-index: 1;
      width: min(720px, calc(100% - 40px));
      padding: clamp(42px, 8vw, 82px) 28px;
      text-align: center;
      animation: arrive 1.1s cubic-bezier(.2,.8,.2,1) both;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      margin: 0 0 25px;
      color: var(--gold);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    .eyebrow::before, .eyebrow::after {
      content: '';
      width: 25px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold));
    }
    .eyebrow::after { transform: scaleX(-1); }

    h1 {
      margin: 0;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(4rem, 12vw, 8.4rem);
      font-weight: 600;
      letter-spacing: -.065em;
      line-height: .98;
      text-shadow: 0 8px 50px rgba(167, 156, 255, .18);
    }

    h1 span {
      display: block;
      color: transparent;
      background: linear-gradient(110deg, #f8e4b2 10%, #f3c879 43%, #d9a8dc 78%, #a79cff);
      -webkit-background-clip: text;
      background-clip: text;
    }

    .rule {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 31px auto 23px;
      color: var(--gold);
      font-size: .72rem;
    }

    .rule::before, .rule::after {
      content: '';
      width: 48px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(243, 200, 121, .65));
    }
    .rule::after { transform: scaleX(-1); }

    .message {
      max-width: 390px;
      margin: 0 auto;
      color: var(--muted);
      font-size: clamp(.98rem, 2vw, 1.12rem);
      line-height: 1.8;
      letter-spacing: .01em;
    }

    .signature {
      margin: 47px 0 0;
      color: rgba(181, 179, 200, .58);
      font-size: .68rem;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .orb {
      position: absolute;
      z-index: -1;
      top: 50%;
      left: 50%;
      width: min(74vw, 510px);
      aspect-ratio: 1;
      border: 1px solid rgba(243, 200, 121, .1);
      border-radius: 50%;
      transform: translate(-50%, -52%);
      box-shadow: 0 0 90px rgba(141, 112, 211, .08), inset 0 0 90px rgba(141, 112, 211, .05);
    }

    .orb::before, .orb::after {
      content: '';
      position: absolute;
      inset: 9%;
      border: 1px solid rgba(167, 156, 255, .08);
      border-radius: 50%;
    }
    .orb::after { inset: 19%; border-color: rgba(243, 200, 121, .06); }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes shimmer { from { opacity: .48; } to { opacity: .9; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <nav aria-label="Main navigation">
    <a href="index.html" aria-current="page">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
  <main>
    <div class="orb" aria-hidden="true"></div>
    <p class="eyebrow">A new beginning</p>
    <h1>Hello,<span>World.</span></h1>
    <div class="rule" aria-hidden="true">✦</div>
    <p class="message">Every great idea starts with a simple hello.<br>Here’s to whatever comes next.</p>
    <p class="signature">Made with a little wonder</p>
  </main>
</body>
</html>
